<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Watch</title>
<link rel="icon" href="data:,">
<style nonce="__NONCE__">
:root {
  color-scheme: light;
  --bg: #f4f5f7; --panel: #ffffff; --panel2: #eef0f3; --line: #d9dde3; --text: #1b2027; --muted: #5a6370;
  --accent: #1f5fa8; --run: #12724f; --run-bg: #dcf1e8; --wait: #8a5a00; --wait-bg: #fbeed2;
  --stall: #b3261e; --stall-bg: #fbe0dd; --done: #4d5663; --done-bg: #e6e8ec; --orphan: #6a3f96; --orphan-bg: #eee3f6;
  --idle: #41688f; --idle-bg: #e0eaf4; --fail: #a4262c; --fail-bg: #f9e0e1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #14171b; --panel: #1c2026; --panel2: #252a31; --line: #333a43; --text: #e5e8ec; --muted: #9aa4b1;
    --accent: #7db4ee; --run: #6ad3a8; --run-bg: #17392d; --wait: #e7bb67; --wait-bg: #3d2f12;
    --stall: #ff9d94; --stall-bg: #4b1f1c; --done: #aab3bf; --done-bg: #2c323a; --orphan: #c9a6ec; --orphan-bg: #352647;
    --idle: #9dc1e4; --idle-bg: #20303f; --fail: #ff9d94; --fail-bg: #4b1f1c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #14171b; --panel: #1c2026; --panel2: #252a31; --line: #333a43; --text: #e5e8ec; --muted: #9aa4b1;
  --accent: #7db4ee; --run: #6ad3a8; --run-bg: #17392d; --wait: #e7bb67; --wait-bg: #3d2f12;
  --stall: #ff9d94; --stall-bg: #4b1f1c; --done: #aab3bf; --done-bg: #2c323a; --orphan: #c9a6ec; --orphan-bg: #352647;
  --idle: #9dc1e4; --idle-bg: #20303f; --fail: #ff9d94; --fail-bg: #4b1f1c;
}
html { font-size: clamp(13px, 0.35vw + 9px, 16px); }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif; line-height: 1.4;
}
code, .mono { font-family: "Cascadia Mono", Consolas, monospace; }
button { font: inherit; color: inherit; }
#top {
  position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 1rem;
  padding: 0.5rem 1rem; background: var(--panel); border-bottom: 1px solid var(--line);
}
#brand { font-weight: 700; }
.counter { display: inline-flex; gap: 0.3rem; align-items: baseline; color: var(--muted); }
.counter b { color: var(--text); font-variant-numeric: tabular-nums; }
.counter.alert b, .counter.alert { color: var(--stall); }
button.counter { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
#counters { display: flex; flex-wrap: wrap; gap: 0.2rem 0.9rem; }
#usage { color: var(--muted); }
#usage b.ok { color: var(--run); } #usage b.warn { color: var(--wait); } #usage b.crit { color: var(--stall); }
#updated { color: var(--muted); font-variant-numeric: tabular-nums; }
#spacer { flex: 1 1 auto; }
.toggle { display: inline-flex; gap: 0.3rem; align-items: center; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--panel2); padding: 0.15rem 0.6rem; border-radius: 4px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
#banner { display: none; flex-basis: 100%; background: var(--stall-bg); color: var(--stall); padding: 0.2rem 0.6rem; border-radius: 3px; font-weight: 600; }
#banner.on { display: block; }
.offline #main, .offline #drawer { opacity: 0.55; }
#layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 2.6rem); }
#side { border-right: 1px solid var(--line); background: var(--panel); padding: 0.6rem; overflow-y: auto; max-height: calc(100vh - 2.6rem); position: sticky; top: 2.6rem; }
#filter { width: 100%; padding: 0.25rem 0.45rem; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--text); margin-bottom: 0.45rem; }
#pick { display: none; width: 100%; padding: 0.25rem; margin-bottom: 0.6rem; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
.group { color: var(--muted); font-size: 0.85rem; margin: 0.6rem 0.2rem 0.2rem; }
details.closed-group > summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; margin: 0.6rem 0.2rem 0.2rem; }
.srow { display: grid; grid-template-columns: 0.8rem minmax(0, 1fr); gap: 0.1rem 0.4rem; padding: 0.3rem 0.35rem; border-radius: 4px; cursor: pointer; border: 1px solid transparent; }
.srow:hover { background: var(--panel2); }
.srow.sel { border-color: var(--accent); background: var(--panel2); }
.dot { width: 0.6rem; height: 0.6rem; border-radius: 50%; margin-top: 0.35rem; border: 2px solid transparent; }
.legend { display: flex; flex-wrap: wrap; gap: 0.1rem 0.7rem; color: var(--muted); font-size: 0.8rem; margin: 0.8rem 0.2rem 0; }
.legend .dot { display: inline-block; margin: 0 0.25rem 0 0; vertical-align: baseline; }
.dot.busy { background: var(--run); border-color: var(--run); }
.dot.wait { border-color: var(--idle); }
.dot.alert { background: var(--stall); border-color: var(--stall); }
.stitle { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ssub { grid-column: 2; color: var(--muted); font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#main { padding: 0.8rem 1rem 2rem; min-width: 0; }
.section-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.7rem; margin: 1.1rem 0 0.4rem; }
.section-h h2 { font-size: 1.05rem; margin: 0; }
.section-h .sub { color: var(--muted); font-size: 0.88rem; min-width: 0; overflow-wrap: anywhere; }
.chip { display: inline-block; padding: 0 0.45rem; border-radius: 3px; font-size: 0.85rem; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: baseline; }
.c-running { background: var(--run-bg); color: var(--run); }
.c-waiting { background: var(--wait-bg); color: var(--wait); }
.c-stalled { background: var(--stall-bg); color: var(--stall); font-weight: 600; }
.c-finished { background: var(--done-bg); color: var(--done); }
.c-failed { background: var(--fail-bg); color: var(--fail); }
.c-orphaned { background: var(--orphan-bg); color: var(--orphan); }
.c-idle { background: var(--idle-bg); color: var(--idle); }
.c-closed, .c-unknown { background: var(--done-bg); color: var(--done); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 0.55rem; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 0.5rem 0.65rem; cursor: pointer; min-width: 0; }
.card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
.card.st-stalled { border-color: var(--stall); }
.card-head { display: flex; gap: 0.5rem; align-items: baseline; justify-content: space-between; min-width: 0; }
.card-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.card-head .chip { flex: 0 1 auto; max-width: 55%; }
.meta { color: var(--muted); font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step { margin-top: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step .tool { font-weight: 600; }
.step .since { color: var(--muted); }
.lasttool { color: var(--muted); font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snippet { color: var(--muted); font-size: 0.9rem; margin-top: 0.15rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.foot { margin-top: 0.25rem; color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.parent { color: var(--muted); font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wf { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 0.5rem 0.65rem; margin-top: 0.55rem; }
.wf > summary { cursor: pointer; list-style: none; }
.wf > summary::-webkit-details-marker { display: none; }
.wf-head { display: flex; flex-wrap: wrap; gap: 0.2rem 0.7rem; align-items: baseline; }
.wf-name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.wf-stat { color: var(--muted); font-size: 0.88rem; font-variant-numeric: tabular-nums; }
.phase { display: grid; grid-template-columns: minmax(0, 12rem) minmax(0, 1fr) 11rem; gap: 0.5rem; align-items: center; margin-top: 0.25rem; font-size: 0.88rem; max-width: 60rem; }
.phase .pt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.bar { display: flex; height: 0.5rem; background: var(--panel2); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; }
.bar .b-done { background: var(--done); } .bar .b-err { background: var(--stall); } .bar .b-run { background: var(--run); }
.pc { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.table { margin-top: 0.35rem; }
.row { display: grid; gap: 0.5rem; padding: 0.22rem 0.3rem; border-top: 1px solid var(--line); align-items: baseline; font-size: 0.9rem; min-width: 0; }
.row > * { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.head { color: var(--muted); font-size: 0.82rem; border-top: 0; }
.row.click { cursor: pointer; } .row.click:hover { background: var(--panel2); }
.row.st-stalled, .row.st-stalled:hover { background: var(--stall-bg); border-left: 3px solid var(--stall); padding-left: calc(0.3rem - 3px); }
.t-wf .row, .t-codex .row { grid-template-columns: minmax(10rem, 1fr) 11.5rem minmax(0, 4fr) 5.5rem; }
.t-bg .row { grid-template-columns: minmax(0, 2fr) minmax(0, 1.2fr) 11.5rem 5.5rem; }
.cell2 > span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell2 .l2 { color: var(--muted); font-size: 0.85rem; }
.linkbtn { background: none; border: 0; padding: 0.2rem 0.3rem; color: var(--accent); cursor: pointer; font-size: 0.85rem; }
.empty { color: var(--muted); padding: 0.5rem 0.2rem; }
#sessions-empty { display: none; }
#sessions-empty.on { display: block; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 0.2rem 0.5rem; }
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--panel); border-left: 1px solid var(--line); z-index: 10; padding: 0.7rem 0.9rem; overflow-y: auto; display: none; }
#drawer.on { display: block; }
#drawer h3 { margin: 0 0 0.3rem; font-size: 1.05rem; padding-right: 3rem; overflow-wrap: anywhere; }
#d-close { position: absolute; top: 0.6rem; right: 0.8rem; }
.kv { display: grid; grid-template-columns: 7rem minmax(0, 1fr); gap: 0.1rem 0.5rem; font-size: 0.9rem; margin: 0.4rem 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.note { color: var(--muted); font-size: 0.85rem; margin: 0.4rem 0; }
.ev { display: grid; grid-template-columns: 4.6rem 4.4rem minmax(0, 1fr); gap: 0.4rem; padding: 0.16rem 0; border-top: 1px solid var(--line); font-size: 0.87rem; }
.ev .when { color: var(--muted); font-variant-numeric: tabular-nums; }
.ev .kind { color: var(--muted); }
.ev .body { overflow-wrap: anywhere; }
.ev .fail { color: var(--stall); font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .card, .srow, .btn { transition: border-color 120ms; } }
@media (max-width: 1599px) { #layout { grid-template-columns: 260px minmax(0, 1fr); } }
@media (min-width: 2560px) { #layout { grid-template-columns: 340px minmax(0, 1fr); } }
@media (max-width: 1199px) {
  #layout { grid-template-columns: minmax(0, 1fr); }
  #side { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
  #list { display: none; } #filter { display: none; } #pick { display: block; margin-bottom: 0; }
  .row, .t-wf .row, .t-codex .row, .t-bg .row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .row.head { display: none; }
}
</style>
</head>
<body>
<div id="top">
  <span id="brand">Agent Watch</span>
  <span id="counters"></span>
  <span id="usage"></span>
  <span id="spacer"></span>
  <span id="updated"></span>
  <label class="toggle"><input type="checkbox" id="only" checked> Active only</label>
  <button class="btn" id="theme" type="button"></button>
  <div id="banner">Disconnected from server</div>
</div>
<div id="layout">
  <nav id="side" aria-label="Session list">
    <input id="filter" type="search" placeholder="Filter titles" aria-label="Filter titles">
    <select id="pick" aria-label="Select session"></select>
    <div id="list"></div>
  </nav>
  <main id="main">
    <div class="empty" id="sessions-loading">Loading.</div>
    <div id="sessions"></div>
    <div class="empty" id="sessions-empty">No active items.</div>
    <div class="section-h"><h2>Codex</h2><span class="sub" id="codex-sub"></span></div>
    <div class="panel t-codex" id="codex"></div>
    <div class="section-h"><h2>Background jobs</h2><span class="sub" id="bg-sub"></span></div>
    <div class="panel t-bg" id="bg"></div>
  </main>
</div>
<aside id="drawer" aria-label="Details">
  <button class="btn" id="d-close" type="button">Close</button>
  <h3 id="d-title"></h3>
  <div id="d-chip"></div>
  <dl class="kv" id="d-kv"></dl>
  <div class="note">Tool output and file contents are not displayed.</div>
  <div id="d-events"></div>
</aside>
<script nonce="__NONCE__">
"use strict";
const $ = (id) => document.getElementById(id);
const S = { data: null, etag: null, sel: "all", only: true, q: "", drawer: null, timer: null, delay: 2000, paused: false, lastOkText: "", stallIdx: 0 };
const ACTIVE = new Set(["running", "waiting", "stalled"]);
const TOKEN_TIP = "Estimated context of the last message (input + cache + output). Values without ≈ come from completion records.";
const WAIT_REASON = new Set(["Waiting for background jobs", "Waiting for user input", "Checking completion", "Waiting for subagents"]);
const OMIT_NAME = { agents: "Agents", workflow_agents: "Workflow agents", workflows: "Workflows", bg: "Background", codex: "Codex", sessions: "Sessions", hot_files: "Queued files" };

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function txt(e, v) { v = v == null ? "" : String(v); if (e.textContent !== v) e.textContent = v; }
function cls(e, v) { if (e.className !== v) e.className = v; }
function tip(e, v) { v = v || ""; if (e.title !== v) e.title = v; }
function show(e, on) { const d = on ? "" : "none"; if (e.style.display !== d) e.style.display = d; }
function data(e, k, v) { v = v == null ? "" : String(v); if (e.dataset[k] !== v) e.dataset[k] = v; }
function width(e, pct) { const v = Math.round(pct) + "%"; if (e.style.width !== v) e.style.width = v; }

function keyed(parent, items, keyOf, make, patch) {
  const map = parent._k || (parent._k = new Map());
  const seen = new Set();
  let cursor = parent.firstChild;
  for (const it of items) {
    const k = keyOf(it);
    seen.add(k);
    let node = map.get(k);
    if (!node) { node = make(it); map.set(k, node); }
    patch(node, it);
    if (node === cursor) cursor = cursor.nextSibling;
    else parent.insertBefore(node, cursor);
  }
  for (const [k, node] of map) {
    if (!seen.has(k)) { node.remove(); map.delete(k); }
  }
}

function pad(n) { return String(n).padStart(2, "0"); }
function clock(ms) { if (!ms) return ""; const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function dateShort(ms) { if (!ms) return ""; const d = new Date(ms); return `${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function dur(ms) {
  if (ms == null || ms < 0) return "";
  const s = Math.floor(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}min ${s % 60}s`;
  const h = Math.floor(m / 60);
  if (h >= 48) return `${Math.floor(h / 24)}d ${h % 24}h`;
  return `${h}h ${m % 60}min`;
}
function ago(ms) {
  if (!ms) return "";
  const d = Date.now() - ms;
  if (d < 60000) return "just now";
  if (d < 3600000) return `${Math.floor(d / 60000)}min ago`;
  if (d < 86400000) return `${Math.floor(d / 3600000)}h ago`;
  return `${Math.floor(d / 86400000)}d ago`;
}
function num(v) {
  if (v == null) return "";
  if (v >= 1e6) return (v / 1e6).toFixed(1) + "M";
  if (v >= 1e3) return (v / 1e3).toFixed(1) + "k";
  return String(v);
}
function tokenText(t) { if (!t || t.value == null) return ""; return (t.exact ? "" : "≈") + num(t.value); }
function bytes(v) {
  if (v == null) return "";
  if (v >= 1048576) return (v / 1048576).toFixed(1) + "MB";
  if (v >= 1024) return (v / 1024).toFixed(0) + "KB";
  return v + "B";
}
function shortModel(m) { return m ? m.replace(/^claude-/, "") : ""; }
function statusClass(o) {
  if (o.status === "finished" && (o.outcome === "failed" || o.outcome === "killed" || o.outcome === "stopped")) return "chip c-failed";
  return "chip c-" + (o.status || "unknown");
}
function stepText(st) {
  if (!st) return ["", ""];
  switch (st.kind) {
    case "tool": return [(st.tool || "Tool") + (st.parallel ? ` + ${st.parallel}` : ""), st.arg || ""];
    case "model_wait": return ["", "Waiting for model response"];
    case "thinking": return ["", "Thinking"];
    case "writing": return ["", "Writing response"];
    case "retry": return ["", st.attempt != null ? `API retry ${st.attempt}/${st.max}` : "API retry"];
    case "turn_end": return ["", "Response complete"];
    case "prompt": return ["", "Prompt received"];
    case "compact": return ["", "Compacting context"];
    default: return ["", "Checking"];
  }
}
function okText(v) { return v === true ? "Succeeded" : v === false ? "Failed" : "Progress"; }
/* Table chips show status; time and tools appear in the current activity column. */
function chipLabel(o) {
  if (o.status === "running") return "Working";
  if (o.status === "waiting") return "Waiting";
  if (o.status === "stalled") { const m = /(\d+)min/.exec(o.status_label || ""); return m ? `Possibly stalled ${m[1]}min` : "Possibly stalled"; }
  return o.status_label;
}
const STEP_LABEL = /^(Waiting for model response|Running tool|Thinking|Writing response|API retry|Prompt received|Compacting context|Quiet)/;
/* Shorten labels that repeat the separate activity line; retain waiting reasons. */
function cardChip(a) { return a.status === "waiting" && !STEP_LABEL.test(a.status_label || "") ? a.status_label : chipLabel(a); }
function nowText(a) {
  if (!ACTIVE.has(a.status)) return "";
  if (WAIT_REASON.has(a.status_label)) return a.status_label;
  const [tool, arg] = stepText(a.step);
  return tool ? `${tool} ${arg}`.trim() : arg;
}

/* ---- Top bar ---- */
function omitText(server) {
  const o = server.omitted || {};
  return Object.keys(OMIT_NAME).filter((k) => o[k]).map((k) => `${OMIT_NAME[k]} ${o[k]}`).join(", ");
}
function renderTop(d) {
  const c = d.counts || {};
  const rows = [
    ["Sessions", c.sessions_live], ["Working", c.sessions_busy], ["Agents", c.agents_running],
    ["Workflows", c.workflows_running], ["Codex", c.codex_running], ["Background", c.bg_running],
  ];
  if (c.agents_stalled > 0) rows.push(["Possibly stalled", c.agents_stalled, true]);
  if (d.server && d.server.backfill_pct < 100) rows.push(["Reading launch records", d.server.backfill_pct + "%"]);
  if (d.server && d.server.truncated) rows.push(["Some items omitted", omitText(d.server)]);
  keyed($("counters"), rows, (r) => r[0], (r) => {
    const s = el(r[2] ? "button" : "span", "counter");
    if (r[2]) { s.type = "button"; s.title = "Jump to stalled item"; s.addEventListener("click", jumpStalled); }
    s.append(el("span", null, r[0]), el("b")); return s;
  }, (n, r) => { cls(n, r[2] ? "counter alert" : "counter"); txt(n.lastChild, r[1]); });
  const u = d.codex_usage || {};
  const wrap = $("usage");
  const wins = u.windows || [];
  const parts = wins.map((w) => [w.tag === "WK" ? "Weekly" : w.tag, w]);
  keyed(wrap, parts, (p) => p[0], (p) => {
    const s = el("span"); s.append(el("span", null, `Codex ${p[0]} `), el("b"), el("span")); return s;
  }, (n, p) => {
    const w = p[1];
    txt(n.children[1], Math.round(w.used_percent) + "%");
    cls(n.children[1], w.level);
    txt(n.children[2], ` · resets ${dateShort(w.resets_at_ms)} · snapshot ${ago(u.snapshot_ms)}  `);
  });
}

function jumpStalled() {
  if (S.sel !== "all") select("all");
  const list = [...document.querySelectorAll(".card.st-stalled, .row.st-stalled")].filter((e) => e.offsetParent !== null);
  if (!list.length) return;
  const t = list[S.stallIdx++ % list.length];

/* ---- Refresh elapsed time every ten seconds; pause while hidden. ---- */
function tickTimes() {

    for (const e of document.querySelectorAll(".foot[data-started]")) txt(e, footText(e));
    for (const e of document.querySelectorAll(".since")) txt(e, sinceText(e));

/* ---- Drawer ---- */
function kv(host, rows) {
  keyed(host, rows.flatMap((r, i) => [[`k${i}`, r[0], "dt"], [`v${i}`, r[1], "dd"]]), (r) => r[0], (r) => el(r[2]), (n, r) => txt(n, r[1]));
}
/* Merge tool calls and results, newest first; input is oldest first. */
function mergeEvents(events) {
  const out = [];
  const open = new Map();
  for (const e of events) {
    if (e.kind === "model_wait") continue;
    if (e.kind === "tool_call") {
      const row = Object.assign({}, e, { call: true, done: false });
      out.push(row);
      if (!open.has(e.tool)) open.set(e.tool, []);
      open.get(e.tool).push(row);
    } else if (e.kind === "tool_result") {
      const q = open.get(e.tool);
      if (q && q.length) { const c = q.shift(); c.ok = e.ok; c.done = true; }
      else out.push(e);
    } else out.push(e);
  }
  return out.reverse();
}
const EV_NAME = { tool_call: "Tool", tool_result: "Result", text: "Message", retry: "Retry", turn_end: "Response complete", prompt: "Prompt", notification: "Notification", compact: "Compaction", turn_start: "Turn started" };
function fillDrawer(title, chipEl, rows, events, closed) {
  txt($("d-title"), title);
  const host = $("d-chip");
  keyed(host, [chipEl], () => "chip", () => el("span", "chip"), (n, c) => { txt(n, c.label); cls(n, c.cls); show(n, !!c.label); });
  kv($("d-kv"), rows);
  keyed($("d-events"), mergeEvents(events).map((e, i) => [i, e]), (p) => p[0], () => {
    const r = el("div", "ev");
    r._w = el("span", "when"); r._k = el("span", "kind"); r._b = el("span", "body");
    r.append(r._w, r._k, r._b);
    return r;
  }, (r, p) => {
    const e = p[1];
    txt(r._w, clock(e.ts_ms));
    txt(r._k, EV_NAME[e.kind] || e.kind);
    const parts = [e.tool, e.arg, e.text].filter(Boolean);
    let extra = "";
    if (e.kind === "tool_result") extra = okText(e.ok);
    else if (e.call) extra = e.done ? (e.ok == null ? "Completed" : okText(e.ok)) : (closed || e.noState ? "" : "Progress");
    txt(r._b, [parts.join(" "), extra].filter(Boolean).join(" · "));
    cls(r._b, e.ok === false ? "body fail" : "body");
  });
}
async function pollDrawer() {
  const dr = S.drawer;
  if (!dr || document.hidden || dr.busy) return;
  dr.busy = true;
  try {
    const url = dr.kind === "agent"
      ? `/api/agent?session=${encodeURIComponent(dr.sid)}&agent=${encodeURIComponent(dr.aid)}`
      : `/api/codex?thread=${encodeURIComponent(dr.tid)}`;
    const res = await fetch(url, { cache: "no-store" });
    if (S.drawer !== dr) return;
    if (res.ok) {
      const j = await res.json();
      const h = j.header || {};
      const active = ACTIVE.has(h.status);
      const t = h.tokens || {};
      if (dr.kind === "agent") {
        const since = active && h.step && h.step.since_ms ? `(${dur(Date.now() - h.step.since_ms)} elapsed)` : "";
        const spent = active ? (h.started_ms ? dur(Date.now() - h.started_ms) : "") : (h.elapsed_ms != null ? dur(h.elapsed_ms) : "");
        fillDrawer(h.description || h.agent_id, { label: h.status_label, cls: statusClass(h) }, [
          ["Now", [nowText(h), since].filter(Boolean).join(" ")],
          ["Elapsed", spent],
          ["Last message", h.last_text || ""],
          ["Model", h.model || h.model_alias || ""],
          ["Tokens", tokenText(t)],
          ["Type", agentMeta(h)],
          ["File", j.path_display || ""],
        ].filter((r) => r[1]), j.events || [], !active);
      } else {
        const lc = h.last_command;
        const turns = h.turns ? `Completed ${h.turns.completed} · Start ${h.turns.started}${h.turns.exact ? "" : " or more"}` : "";
        const spent = active ? (h.started_ms ? dur(Date.now() - h.started_ms) : "") : (h.elapsed_ms != null ? dur(h.elapsed_ms) : "");
        const events = (j.events || []).map((e) => (e.kind === "tool_call" && e.tool !== "exec" ? Object.assign({}, e, { noState: true }) : e));
        fillDrawer(h.packet || h.short, { label: h.status_label, cls: statusClass(h) }, [
          ["Now", active ? (lc && lc.state === "running" ? lc.text : h.status_label) : ""],
          ["Elapsed", spent],
          ["Last message", h.last_message || ""],
          ["Last command", lc && lc.text ? lc.text + (lc.exit_code != null ? ` (exit ${lc.exit_code})` : "") : ""],
          ["Model", [h.model, h.effort].filter(Boolean).join(" ")],
          ["Sandbox", h.sandbox || ""],
          ["Tokens", t.total != null ? `${num(t.total)} (Output ${num(t.output)})` : ""],
          ["Turns", turns],
          ["Path", h.cwd_display || ""],
        ].filter((r) => r[1]), events, !active);
      }
    } else if (res.status === 404) {
      fillDrawer("This item is no longer listed", { label: "", cls: "chip" }, [], [], true);
    }
  } catch (e) { /* Retry next cycle. */ }
  dr.busy = false;
  if (S.drawer === dr) dr.timer = setTimeout(pollDrawer, 2000);
}
function openPanel(dr) {
  closeDrawer();
  S.drawer = dr;
  fillDrawer("Loading", { label: "", cls: "chip" }, [], [], true);
  $("drawer").classList.add("on");
  pollDrawer();
}
function openDrawer(sid, aid) { openPanel({ kind: "agent", sid, aid }); }
function openCodex(tid) { if (tid) openPanel({ kind: "codex", tid }); }
function closeDrawer() {
  if (S.drawer && S.drawer.timer) clearTimeout(S.drawer.timer);
  S.drawer = null;
  $("drawer").classList.remove("on");
}

/* ---- Polling ---- */
async function loop() {
  if (document.hidden) { S.paused = true; return; }
  try {
    const res = await fetch("/api/state", { cache: "no-store", headers: S.etag ? { "If-None-Match": S.etag } : {} });
    if (res.status === 304) {
      okBeat();
    } else if (res.ok) {
      S.etag = res.headers.get("ETag");
      S.data = await res.json();
      render();
      okBeat();
    } else {
      throw new Error("status");
    }
    S.delay = 2000;
  } catch (e) {
    S.etag = null; /* The server may have restarted while disconnected; fetch the next response unconditionally. */
    S.delay = Math.min(S.delay * 2, 30000);
    $("banner").classList.add("on");
    document.body.classList.add("offline");
    txt($("updated"), S.lastOkText ? `Disconnected, Last updated ${S.lastOkText}` : "Disconnected");
    loaded();
  }
  S.timer = setTimeout(loop, S.delay);
}
function okBeat() {
  $("banner").classList.remove("on");
  document.body.classList.remove("offline");
  S.lastOkText = clock(Date.now());
  txt($("updated"), "Updated " + S.lastOkText);
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    if (S.paused) { S.paused = false; loop(); }
    if (S.drawer) { clearTimeout(S.drawer.timer); pollDrawer(); }
  }
});

/* ---- Settings ---- */
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* Ignore unavailable storage. */ } }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
const THEMES = ["auto", "light", "dark"];
const THEME_NAME = { auto: "Auto", light: "Light", dark: "Dark" };
function applyTheme(t) {
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  txt($("theme"), "Theme: " + THEME_NAME[t]);
  S.theme = t;
}
applyTheme(THEMES.includes(load("aw-theme")) ? load("aw-theme") : "auto");
$("theme").addEventListener("click", () => {
  const t = THEMES[(THEMES.indexOf(S.theme) + 1) % THEMES.length];
  applyTheme(t); store("aw-theme", t);
});
const savedOnly = load("aw-only");
if (savedOnly === "0") { S.only = false; $("only").checked = false; }
$("only").addEventListener("change", (e) => { S.only = e.target.checked; store("aw-only", S.only ? "1" : "0"); render(); });
$("filter").addEventListener("input", (e) => { S.q = e.target.value; render(); });
$("pick").addEventListener("change", (e) => select(e.target.value));
$("d-close").addEventListener("click", closeDrawer);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
loop();
setTimeout(tickTimes, 10000);
</script>
